services:
  - type: web
    name: clsu-osa-scholarship
    env: docker
    plan: free
    region: singapore
    branch: staging
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health-check
    disk:
      name: aegis_uploads_disk
      mountPath: /var/www/html/storage/app
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://clsu.osa.scholarship
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: public
      # Mail Delivery Configuration (Brevo API HTTPS Port 443 - Bypass Render Free SMTP block)
      - key: MAIL_MAILER
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: gadianoriel07@gmail.com
      - key: MAIL_FROM_NAME
        value: "AEGIS CLSU"
      # Cloudflare R2 Persistent Storage (Zero-Cost Cloud Storage)
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_URL
        sync: false
