<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680">
<rect x="0" y="0" width="1200" height="680" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
</marker>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#C77C22"/>
</marker>
</defs>

<text x="600" y="40" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 2. Agile Development Process of the AEGIS Project</text>

<!-- Sprint timeline row -->
<rect x="40" y="90" width="150" height="50" rx="25" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="115" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#FFFFFF">Sprint 1</text>

<line x1="190" y1="115" x2="230" y2="115" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="230" y="90" width="150" height="50" rx="25" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="305" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#FFFFFF">Sprint 2</text>

<line x1="380" y1="115" x2="420" y2="115" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="420" y="90" width="150" height="50" rx="25" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="495" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#FFFFFF">Sprint 3</text>

<line x1="570" y1="115" x2="610" y2="115" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="610" y="90" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="650" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#595959">&#8230;</text>

<line x1="690" y1="115" x2="730" y2="115" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="730" y="90" width="150" height="50" rx="25" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="805" y="120" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#FFFFFF">Sprint 10</text>

<text x="600" y="175" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#595959">Representative timeline &#8212; Sprints 4 through 9 follow the identical cycle shown below (omitted for space)</text>

<text x="600" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Each sprint follows the same repeating cycle:</text>
<line x1="600" y1="235" x2="600" y2="258" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Cycle container -->
<rect x="40" y="260" width="1140" height="340" rx="10" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="8,5"/>
<text x="70" y="295" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A">Sprint Cycle &#8212; repeated across all 10 project sprints</text>

<!-- 5 phase nodes -->
<rect x="80" y="340" width="160" height="80" rx="10" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="160" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF">Plan</text>

<line x1="240" y1="380" x2="285" y2="380" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="290" y="340" width="160" height="80" rx="10" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="370" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF">Develop</text>

<line x1="450" y1="380" x2="495" y2="380" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="500" y="340" width="160" height="80" rx="10" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="580" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF">Test</text>

<line x1="660" y1="380" x2="705" y2="380" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="710" y="340" width="160" height="80" rx="10" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="790" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF">Review</text>

<line x1="870" y1="380" x2="915" y2="380" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="920" y="340" width="160" height="80" rx="10" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="1000" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF">Retro-</text>
<text x="1000" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#FFFFFF">spective</text>

<!-- Return loop -->
<path d="M 1000,420 C 1000,520 160,520 160,420" fill="none" stroke="#C77C22" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
<text x="580" y="545" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#C77C22">carries into next sprint</text>

<text x="600" y="630" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#595959">Plan &#8594; Develop &#8594; Test &#8594; Review &#8594; Retrospective, repeated identically across all 10 sprints of the project timeline.</text>
</svg>
