<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowFilled" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowOpen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1A1A1A" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="910" fill="#FFFFFF"/>
  <text x="600" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">Figure 18. Sequence Diagram &#8212; Scholarship Application Submission and Document Upload</text>

  <!-- Participant headers -->
  <rect x="65" y="55" width="190" height="50" fill="#1F4E79" stroke="#1A1A1A"/>
  <text x="160" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Student</text>
  <text x="160" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">(Browser)</text>

  <rect x="285" y="55" width="190" height="50" fill="#1F4E79" stroke="#1A1A1A"/>
  <text x="380" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">ApplicationController</text>

  <rect x="505" y="55" width="190" height="50" fill="#1F4E79" stroke="#1A1A1A"/>
  <text x="600" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">DocumentController</text>

  <rect x="725" y="55" width="190" height="50" fill="#C77C22" stroke="#1A1A1A"/>
  <text x="820" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">CloudStorageService</text>

  <rect x="945" y="55" width="190" height="50" fill="#595959" stroke="#1A1A1A"/>
  <text x="1040" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Database</text>

  <!-- Note on DocumentController's inactivity in this flow -->
  <rect x="505" y="112" width="190" height="66" fill="#D9D9D9" stroke="#8C8C8C"/>
  <text x="600" y="126" text-anchor="middle" font-size="9" font-style="italic" fill="#595959">Note (Ch.10.1): no upload route</text>
  <text x="600" y="139" text-anchor="middle" font-size="9" font-style="italic" fill="#595959">exists here &#8212; intake is inline in</text>
  <text x="600" y="152" text-anchor="middle" font-size="9" font-style="italic" fill="#595959">ApplicationController. This class</text>
  <text x="600" y="165" text-anchor="middle" font-size="9" font-style="italic" fill="#595959">only serves retrieval (view, heatmap...)</text>

  <!-- Lifelines -->
  <line x1="160" y1="105" x2="160" y2="880" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="380" y1="105" x2="380" y2="880" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="600" y1="180" x2="600" y2="880" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="820" y1="105" x2="820" y2="880" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1040" y1="105" x2="1040" y2="880" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Activation bars -->
  <rect x="374" y="190" width="12" height="630" fill="#FFFFFF" stroke="#1A1A1A"/>
  <rect x="814" y="360" width="12" height="180" fill="#FFFFFF" stroke="#1A1A1A"/>
  <rect x="1034" y="280" width="12" height="40" fill="#FFFFFF" stroke="#1A1A1A"/>
  <rect x="1034" y="570" width="12" height="40" fill="#FFFFFF" stroke="#1A1A1A"/>
  <rect x="1034" y="650" width="12" height="40" fill="#FFFFFF" stroke="#1A1A1A"/>

  <!-- 1: self-loop on Student -->
  <text x="205" y="132" text-anchor="middle" font-size="11" fill="#1A1A1A">1: saveDraft() on input &#8594; localStorage</text>
  <path d="M 160,140 L 230,140 L 230,162 L 160,162" fill="none" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- 2 -->
  <text x="270" y="182" text-anchor="middle" font-size="11" fill="#1A1A1A">2: POST /apply {scholarship_id, gwa, custom_fields[], document}</text>
  <line x1="160" y1="190" x2="380" y2="190" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- 3: self-loop on ApplicationController -->
  <text x="450" y="222" text-anchor="middle" font-size="11" fill="#1A1A1A">3: StoreApplicationRequest validates dynamic ScholarshipField rules</text>
  <path d="M 386,230 L 456,230 L 456,252 L 386,252" fill="none" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- 4 -->
  <text x="710" y="272" text-anchor="middle" font-size="11" fill="#1A1A1A">4: hasActiveApplication(); re-fetch Scholarship::with('fields')</text>
  <line x1="380" y1="280" x2="1040" y2="280" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- 5 return -->
  <text x="710" y="312" text-anchor="middle" font-size="11" fill="#1A1A1A">5: eligible &#8212; no active application</text>
  <line x1="1040" y1="320" x2="380" y2="320" stroke="#1A1A1A" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- 6 -->
  <text x="600" y="352" text-anchor="middle" font-size="11" fill="#1A1A1A">6: upload(file, 'uploads', &amp;isSynced)</text>
  <line x1="380" y1="360" x2="820" y2="360" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- 7: self-loop on CloudStorageService -->
  <text x="890" y="392" text-anchor="middle" font-size="11" fill="#1A1A1A">7: hasR2 configured? attempt R2 putFileAs()</text>
  <path d="M 826,400 L 896,400 L 896,422 L 826,422" fill="none" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- divider -->
  <line x1="60" y1="450" x2="1140" y2="450" stroke="#8C8C8C" stroke-width="1" stroke-dasharray="7,4"/>
  <text x="600" y="442" text-anchor="middle" font-size="11" font-style="italic" fill="#595959">alt &#8212; storage outcome</text>

  <!-- 8 return -->
  <text x="600" y="482" text-anchor="middle" font-size="11" fill="#1A1A1A">8: R2 succeeds &#8594; public URL returned (is_synced=true)</text>
  <line x1="820" y1="490" x2="380" y2="490" stroke="#1A1A1A" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- 9 return -->
  <text x="600" y="522" text-anchor="middle" font-size="11" fill="#1A1A1A">9: else R2 fails/not configured &#8594; local path (is_synced=false)</text>
  <line x1="820" y1="530" x2="380" y2="530" stroke="#1A1A1A" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- 10 -->
  <text x="710" y="562" text-anchor="middle" font-size="11" fill="#1A1A1A">10: create Document {file_path, file_data (base64), type='COG', event='initial'}</text>
  <line x1="380" y1="570" x2="1040" y2="570" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- 11 return -->
  <text x="710" y="602" text-anchor="middle" font-size="11" fill="#1A1A1A">11: Document row persisted</text>
  <line x1="1040" y1="610" x2="380" y2="610" stroke="#1A1A1A" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- 12 -->
  <text x="710" y="642" text-anchor="middle" font-size="11" fill="#1A1A1A">12: create placeholder AIResult(scanning); create Application(status='Pending')</text>
  <line x1="380" y1="650" x2="1040" y2="650" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- 13 return -->
  <text x="710" y="682" text-anchor="middle" font-size="11" fill="#1A1A1A">13: rows created</text>
  <line x1="1040" y1="690" x2="380" y2="690" stroke="#1A1A1A" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- 14: self-loop on ApplicationController -->
  <text x="450" y="722" text-anchor="middle" font-size="11" fill="#1A1A1A">14: dispatch ScanDocumentJob (fire-and-forget)</text>
  <path d="M 386,730 L 456,730 L 456,752 L 386,752" fill="none" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

  <!-- 15 return -->
  <text x="270" y="772" text-anchor="middle" font-size="11" fill="#1A1A1A">15: redirect &#8594; student.dashboard ("Application submitted")</text>
  <line x1="380" y1="780" x2="160" y2="780" stroke="#1A1A1A" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- 16: self-loop on Student -->
  <text x="205" y="812" text-anchor="middle" font-size="11" fill="#1A1A1A">16: clear localStorage draft on submit</text>
  <path d="M 160,820 L 230,820 L 230,842 L 160,842" fill="none" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#arrowFilled)"/>

</svg>
