    <text x="1162" y="741" font-size="11" fill="#1A1A1A">accepted_at</text>
    <text x="1260" y="741" font-size="10" fill="#595959">timestamp, nullable</text>
    <line x1="1150" y1="594" x2="1410" y2="594" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="1150" y1="620" x2="1410" y2="620" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="1150" y1="646" x2="1410" y2="646" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="1150" y1="672" x2="1410" y2="672" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="1150" y1="698" x2="1410" y2="698" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="1150" y1="724" x2="1410" y2="724" stroke="#1A1A1A" stroke-width="1"/>
  </g>
  <text x="1150" y="768" font-size="10" fill="#595959" font-style="italic">No FK to users &#8212; deliberately keyed by sender/recipient</text>
  <text x="1150" y="782" font-size="10" fill="#595959" font-style="italic">email address only (Sec. 4.3.27), so the transfer stays verifiable.</text>

  <text x="70" y="270" font-size="10.5" fill="#595959" font-style="italic">auth_logs.user_id is nullable to capture failed logins against emails matching no account (credential-stuffing detection).</text>

  <text x="70" y="810" font-size="10.5" fill="#595959" font-style="italic">All four logging tables record User-attributed events (cardinality 1:0..*). auth_logs sets user_id to null on user delete; the other three cascade.</text>
  <text x="70" y="828" font-size="10.5" fill="#595959" font-style="italic">Written centrally through App\Services\AuditLoggerService (Sec. 4.5), except master_transfers, which its own controller writes and reads directly.</text>
</svg>
