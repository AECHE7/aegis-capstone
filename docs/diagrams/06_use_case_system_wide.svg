<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1150" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1A1A1A" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1450" height="1150" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="725" y="40" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Figure 6. System-Wide Use Case Diagram</text>

  <!-- ===================== ASSOCIATION LINES (drawn first, covered at ends by shapes) ===================== -->
  <g stroke="#1A1A1A" stroke-width="1.2">
    <!-- Student (110,320) -->
    <line x1="110" y1="320" x2="420" y2="180"/>
    <line x1="110" y1="320" x2="420" y2="300"/>
    <line x1="110" y1="320" x2="420" y2="540"/>
    <line x1="110" y1="320" x2="700" y2="180"/>
    <line x1="110" y1="320" x2="700" y2="300"/>
    <line x1="110" y1="320" x2="700" y2="660"/>

    <!-- OSA Staff (1290,590) -->
    <line x1="1290" y1="590" x2="700" y2="180"/>
    <line x1="1290" y1="590" x2="700" y2="300"/>
    <line x1="1290" y1="590" x2="980" y2="180"/>
    <line x1="1290" y1="590" x2="980" y2="420"/>
    <line x1="1290" y1="590" x2="980" y2="540"/>
    <line x1="1290" y1="590" x2="980" y2="660"/>
    <line x1="1290" y1="590" x2="700" y2="660"/>

    <!-- OSA Director / Super Admin (1290,890) -->
    <line x1="1290" y1="890" x2="700" y2="180"/>
    <line x1="1290" y1="890" x2="700" y2="300"/>
    <line x1="1290" y1="890" x2="980" y2="180"/>
    <line x1="1290" y1="890" x2="980" y2="420"/>
    <line x1="1290" y1="890" x2="980" y2="540"/>
    <line x1="1290" y1="890" x2="980" y2="660"/>
    <line x1="1290" y1="890" x2="980" y2="780"/>
    <line x1="1290" y1="890" x2="980" y2="900"/>
    <line x1="1290" y1="890" x2="980" y2="1020"/>
    <line x1="1290" y1="890" x2="700" y2="660"/>

    <!-- AI Forensics Service (1195,300) -->
    <line x1="1195" y1="300" x2="980" y2="300"/>
  </g>

  <!-- ===================== SYSTEM BOUNDARY ===================== -->
  <rect x="260" y="90" width="880" height="1000" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <text x="700" y="118" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle">AEGIS System</text>

  <!-- ===================== USE CASES ===================== -->
  <g>
    <!-- Student lane x=420 -->
    <ellipse cx="420" cy="180" rx="118" ry="42" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <text x="420" y="185" font-size="12" fill="#1A1A1A" text-anchor="middle">Register Account</text>

    <ellipse cx="420" cy="300" rx="118" ry="42" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <text x="420" y="295" font-size="12" fill="#1A1A1A" text-anchor="middle">Submit Scholarship</text>
    <text x="420" y="311" font-size="12" fill="#1A1A1A" text-anchor="middle">Application</text>

    <ellipse cx="420" cy="420" rx="118" ry="42" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
    <text x="420" y="415" font-size="12" fill="#1A1A1A" text-anchor="middle">Upload Supporting</text>
    <text x="420" y="431" font-size="12" fill="#1A1A1A" text-anchor="middle">Documents</text>

    <ellipse cx="420" cy="540" rx="118" ry="42" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
