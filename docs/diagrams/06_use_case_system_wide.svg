  <!-- AI Forensics Service (system actor) -->
  <g>
    <rect x="1195" y="265" width="190" height="70" rx="10" ry="10" fill="#FFFFFF" stroke="#C77C22" stroke-width="2"/>
    <text x="1290" y="292" font-size="11" font-style="italic" fill="#C77C22" text-anchor="middle">&#171;system&#187;</text>
    <text x="1290" y="310" font-size="12" fill="#1A1A1A" text-anchor="middle">AI Forensics Service</text>
  </g>
</svg>
