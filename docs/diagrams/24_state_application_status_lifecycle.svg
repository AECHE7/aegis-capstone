<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#FFFFFF"/>

  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">Figure 24. State Transition Diagram — Scholarship Application Status Lifecycle</text>

  <!-- Initial state -->
  <circle cx="100" cy="90" r="8" fill="#1A1A1A"/>
  <line x1="108" y1="90" x2="176" y2="90" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="78" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">student submits</text>

  <!-- Pending -->
  <rect x="180" y="65" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="280" y="95" text-anchor="middle" font-size="13" fill="#1A1A1A">Pending</text>

  <!-- Under Review -->
  <rect x="180" y="205" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="280" y="235" text-anchor="middle" font-size="13" fill="#1A1A1A">Under Review</text>

  <!-- Approved -->
  <rect x="550" y="65" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="650" y="95" text-anchor="middle" font-size="13" fill="#1A1A1A">Approved</text>

  <!-- Rejected -->
  <rect x="550" y="255" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="650" y="285" text-anchor="middle" font-size="13" fill="#1A1A1A">Rejected</text>

  <!-- Returned -->
  <rect x="180" y="375" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="280" y="405" text-anchor="middle" font-size="13" fill="#1A1A1A">Returned</text>

  <!-- Pending -> Under Review -->
  <line x1="280" y1="115" x2="280" y2="203" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="163" text-anchor="start" font-size="11" font-style="italic" fill="#1A1A1A">staff opens review</text>
  <text x="292" y="177" text-anchor="start" font-size="11" font-style="italic" fill="#1A1A1A">screen (implicit)</text>

  <!-- Pending -> Approved (auto-approval) -->
  <line x1="380" y1="90" x2="548" y2="90" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="78" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">auto-approval threshold met</text>
  <text x="465" y="105" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">(Smart Verification Engine)</text>

  <!-- Under Review -> Approved -->
  <line x1="380" y1="215" x2="548" y2="112" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="185" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">staff approves (Decision Hub</text>
  <text x="470" y="198" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">or bulk action)</text>

  <!-- Under Review -> Rejected -->
  <line x1="380" y1="245" x2="548" y2="275" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="248" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">staff rejects (Decision Hub</text>
  <text x="470" y="261" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">or bulk action)</text>

  <!-- Under Review -> Returned -->
  <line x1="280" y1="255" x2="280" y2="373" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="310" text-anchor="start" font-size="11" font-style="italic" fill="#1A1A1A">staff flags for correction</text>
  <text x="292" y="324" text-anchor="start" font-size="11" font-style="italic" fill="#1A1A1A">(Decision Hub only)</text>

  <!-- Returned -> Pending (loop back) -->
  <polyline points="180,400 40,400 40,40 280,40 280,63" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="45" y="220" text-anchor="start" font-size="11" font-style="italic" fill="#1A1A1A" transform="rotate(-90 45 220)">student resubmits corrected document (re-upload)</text>

  <!-- Final states -->
  <line x1="650" y1="115" x2="650" y2="138" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="650" cy="153" r="10" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="650" cy="153" r="5" fill="#1A1A1A"/>

  <line x1="650" y1="305" x2="650" y2="328" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="650" cy="343" r="10" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="650" cy="343" r="5" fill="#1A1A1A"/>

  <text x="650" y="590" text-anchor="middle" font-size="11" fill="#595959">Source: status_logs vocabulary — App\Models\StatusLog / AdminController::updateStatus() / ApplicationAutoApprovalService::evaluate() (Ch. 8.5)</text>

</svg>
