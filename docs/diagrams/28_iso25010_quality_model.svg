  <rect x="390" y="240" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="470" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">HTTP/JSON contract with</text>
  <text x="470" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">aegis-ai Python service</text>

  <rect x="390" y="308" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="470" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Bootstrap 5, vanilla JS,</text>
  <text x="470" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">PWA service worker</text>

