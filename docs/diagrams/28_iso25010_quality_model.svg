  <rect x="750" y="240" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="830" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">ScanDocumentJob: 5</text>
  <text x="830" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">retries, backoff up</text>
  <text x="830" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">to 360 seconds</text>

  <rect x="750" y="308" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="830" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Queued email fan-out +</text>
  <text x="830" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">EmailLog audit trail</text>

  <rect x="750" y="376" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="830" y="396" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Client-side localStorage</text>
  <text x="830" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">autosave for in-progress</text>
  <text x="830" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">applications</text>

