  <text x="1370" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">aegis-ai on Hugging Face</text>
  <text x="1370" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Spaces + Render</text>

