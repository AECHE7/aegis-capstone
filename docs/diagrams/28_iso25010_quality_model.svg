  <text x="650" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">chapters (Ch. 18) &#8212;</text>
  <text x="650" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">not re-analyzed in Ch. 19</text>

