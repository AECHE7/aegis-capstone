  <text x="1010" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Full architecture in</text>
  <text x="1010" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Chapter 16 (headers,</text>
  <text x="1010" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">CSRF, RBAC, encryption)</text>

  <rect x="930" y="308" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="1010" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Regression-tested via</text>
  <text x="1010" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">MfaAuthenticationTest,</text>
  <text x="1010" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">SecurityHardeningTest</text>

