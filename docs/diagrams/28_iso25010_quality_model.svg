  <line x1="1370" y1="366" x2="1370" y2="376" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ===================== Leaf boxes ===================== -->
  <!-- Col 0: Functional Suitability -->
  <rect x="30" y="240" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="110" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Application, AI review</text>
  <text x="110" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">&amp; multi-tier decision</text>
  <text x="110" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">workflows (apply&#8594;award)</text>

  <rect x="30" y="308" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="110" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Exercised by 200-method</text>
  <text x="110" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Feature test suite (Ch. 20)</text>

  <!-- Col 1: Performance Efficiency -->
  <rect x="210" y="240" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="290" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">GzipResponse compression</text>
  <text x="290" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">(80&#8211;85% payload cut)</text>

  <rect x="210" y="308" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="290" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Eager-loading eliminates</text>
  <text x="290" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">N+1 queries in</text>
  <text x="290" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">AdminController</text>

  <rect x="210" y="376" width="160" height="58" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="1.5"/>
  <text x="290" y="401" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">OPcache: 128MB pool,</text>
  <text x="290" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">validate_timestamps=0</text>

