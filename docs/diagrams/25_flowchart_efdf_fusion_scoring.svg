<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1250" height="1900" fill="#FFFFFF"/>
  <text x="625" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">Figure 25. Flowchart — EFDF Weighted Fusion Scoring Algorithm</text>

  <!-- Start -->
  <rect x="435" y="45" width="380" height="50" rx="25" fill="#1A1A1A"/>
  <text x="625" y="76" text-anchor="middle" font-size="12" fill="#FFFFFF">Start: ForensicFusionEngine.fuse_scores()</text>
  <line x1="625" y1="95" x2="625" y2="133" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Input parallelogram -->
  <polygon points="245,135 1035,135 1005,225 215,225" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="170" text-anchor="middle" font-size="12" fill="#1A1A1A">
    <tspan x="625" dy="0">Input: 8 Detector Results (model_prediction, clone_detection,</tspan>
    <tspan x="625" dy="16">catnet_dct, trufor_cnn, ela_patch, clahe_lab, font_stroke,</tspan>
    <tspan x="625" dy="16">software_fingerprint) — each: detected, risk_score, confidence</tspan>
  </text>
  <line x1="625" y1="225" x2="625" y2="263" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process 1 -->
  <rect x="215" y="265" width="820" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="300" text-anchor="middle" font-size="12" fill="#1A1A1A">
    <tspan x="625" dy="-6">Normalize DETECTOR_WEIGHTS to Sum 1.0</tspan>
    <tspan x="625" dy="16">(raw: 0.35 / 0.20 / 0.15 / 0.12 / 0.08 / 0.06 / 0.02 / 0.02)</tspan>
  </text>
  <line x1="625" y1="335" x2="625" y2="373" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process 2 -->
  <rect x="215" y="375" width="820" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="410" text-anchor="middle" font-size="12" fill="#1A1A1A">
    <tspan x="625" dy="-6">For Each Detected Detector: effective_weight =</tspan>
    <tspan x="625" dy="16">normalized_weight × confidence_multiplier (high 1.1 / med 1.0 / low 0.7)</tspan>
  </text>
  <line x1="625" y1="445" x2="625" y2="483" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process 3 -->
  <rect x="325" y="485" width="600" height="60" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="520" text-anchor="middle" font-size="12" fill="#1A1A1A">weighted_risk_sum = Σ (risk_score × effective_weight)</text>
  <line x1="625" y1="545" x2="625" y2="583" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1: syntax gate -->
  <polygon points="625,585 815,675 625,765 435,675" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="675" text-anchor="middle" font-size="12" fill="#1A1A1A">
    <tspan x="625" dy="-6">Syntax Gate Passed?</tspan>
    <tspan x="625" dy="16">(is_valid_academic_document)</tspan>
  </text>

  <!-- No: gate fails -->
  <line x1="815" y1="675" x2="998" y2="675" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905" y="660" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">No</text>
  <rect x="1000" y="640" width="220" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1110" y="675" text-anchor="middle" font-size="11" fill="#1A1A1A">
    <tspan x="1110" dy="-6">fraud = 38.0 +</tspan>
    <tspan x="1110" dy="16">min(12.0, sum × 0.3)</tspan>
  </text>
  <polyline points="1110,710 1110,1435 975,1435" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1120" y="1000" text-anchor="start" font-size="10" font-style="italic" fill="#1A1A1A" transform="rotate(-90 1120 1000)">pinned 38–50% band, bypasses count/OCR steps</text>

  <!-- Yes -->
  <line x1="625" y1="765" x2="625" y2="803" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="790" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">Yes</text>

  <!-- Decision 2: how many detectors fired -->
  <polygon points="625,805 835,905 625,1005 415,905" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="905" text-anchor="middle" font-size="12" fill="#1A1A1A">
    <tspan x="625" dy="-6">How Many Detectors</tspan>
    <tspan x="625" dy="16">Fired?</tspan>
  </text>

  <!-- fan to bus -->
  <line x1="625" y1="1005" x2="625" y2="1025" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="245" y1="1025" x2="1005" y2="1025" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="245" y1="1025" x2="245" y2="1043" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="495" y1="1025" x2="495" y2="1043" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="755" y1="1025" x2="755" y2="1043" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1005" y1="1025" x2="1005" y2="1043" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="1038" text-anchor="middle" font-size="10" font-style="italic" fill="#1A1A1A">0</text>
  <text x="480" y="1038" text-anchor="middle" font-size="10" font-style="italic" fill="#1A1A1A">1</text>
  <text x="740" y="1038" text-anchor="middle" font-size="10" font-style="italic" fill="#1A1A1A">2</text>
  <text x="985" y="1038" text-anchor="middle" font-size="10" font-style="italic" fill="#1A1A1A">3+</text>

  <!-- B0..B3 -->
  <rect x="135" y="1045" width="220" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="245" y="1080" text-anchor="middle" font-size="11" fill="#1A1A1A">
    <tspan x="245" dy="-6">0 detected →</tspan>
    <tspan x="245" dy="16">fraud = 6.0 (flat baseline)</tspan>
  </text>
  <rect x="385" y="1045" width="220" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="495" y="1080" text-anchor="middle" font-size="11" fill="#1A1A1A">
    <tspan x="495" dy="-6">1 detected →</tspan>
    <tspan x="495" dy="16">fraud = 6.0 + min(24.0, sum×0.8)</tspan>
  </text>
  <rect x="645" y="1045" width="220" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="755" y="1080" text-anchor="middle" font-size="11" fill="#1A1A1A">
    <tspan x="755" dy="-6">2 detected →</tspan>
    <tspan x="755" dy="16">fraud = 6.0 + min(46.0, sum×0.9)</tspan>
  </text>
  <rect x="895" y="1045" width="220" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1005" y="1080" text-anchor="middle" font-size="11" fill="#1A1A1A">
    <tspan x="1005" dy="-6">3+ detected →</tspan>
    <tspan x="1005" dy="16">fraud = 6.0 + min(65.0, sum×1.0)</tspan>
  </text>

  <!-- converge to decision 3 -->
  <line x1="245" y1="1115" x2="245" y2="1135" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="495" y1="1115" x2="495" y2="1135" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="755" y1="1115" x2="755" y2="1135" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="1005" y1="1115" x2="1005" y2="1135" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="245" y1="1135" x2="1005" y2="1135" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="625" y1="1135" x2="625" y2="1145" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 3: OCR credit -->
  <polygon points="625,1145 835,1235 625,1325 415,1235" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="1235" text-anchor="middle" font-size="11" fill="#1A1A1A">
    <tspan x="625" dy="-6">OCR Matched Declared GWA</tspan>
    <tspan x="625" dy="16">AND Running Score &gt; 15.0?</tspan>
  </text>

  <line x1="835" y1="1235" x2="888" y2="1235" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="862" y="1220" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">Yes</text>
  <rect x="890" y="1200" width="220" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1000" y="1235" text-anchor="middle" font-size="11" fill="#1A1A1A">
    <tspan x="1000" dy="-6">Subtract 15-pt OCR</tspan>
    <tspan x="1000" dy="16">Credit (floor at 6.0)</tspan>
  </text>
  <line x1="960" y1="1270" x2="880" y2="1398" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="625" y1="1325" x2="625" y2="1398" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="1360" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">No</text>

  <!-- Clamp process -->
  <rect x="275" y="1400" width="700" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="1435" text-anchor="middle" font-size="12" fill="#1A1A1A">
    <tspan x="625" dy="-6">Clamp to [5.0, 95.0], Round to 1 Decimal</tspan>
    <tspan x="625" dy="16">→ Final fraud_probability</tspan>
  </text>
  <line x1="625" y1="1470" x2="625" y2="1468" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="625" y1="1470" x2="625" y2="1468" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="625" y1="1470" x2="625" y2="1468" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="625" y1="1470" x2="625" y2="1468" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="625" y1="1470" x2="625" y2="1468" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="625" y1="1470" x2="625" y2="1468" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="625" y1="1470" x2="625" y2="1508" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 4: tier -->
  <polygon points="625,1470 825,1565 625,1660 425,1565" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="625" y="1565" text-anchor="middle" font-size="12" fill="#1A1A1A">
    <tspan x="625" dy="-6">Final fraud_probability</tspan>
    <tspan x="625" dy="16">Tier?</tspan>
  </text>

  <line x1="425" y1="1565" x2="300" y2="1726" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="1650" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">&lt; 35%</text>

  <line x1="625" y1="1660" x2="625" y2="1726" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="1695" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">35%–70%</text>

  <line x1="825" y1="1565" x2="950" y2="1726" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="1650" text-anchor="middle" font-size="11" font-style="italic" fill="#1A1A1A">≥ 70%</text>

  <!-- End ovals -->
  <rect x="170" y="1728" width="260" height="64" rx="32" fill="#1A1A1A"/>
  <text x="300" y="1760" text-anchor="middle" font-size="12" fill="#FFFFFF">
    <tspan x="300" dy="-4">Low Risk (Authentic)</tspan>
    <tspan x="300" dy="16">Auto-Approval Eligible</tspan>
  </text>

  <rect x="485" y="1728" width="280" height="64" rx="32" fill="#1A1A1A"/>
  <text x="625" y="1760" text-anchor="middle" font-size="12" fill="#FFFFFF">
    <tspan x="625" dy="-4">Review Recommended</tspan>
    <tspan x="625" dy="16">Manual Review Queue</tspan>
  </text>

  <rect x="810" y="1728" width="280" height="64" rx="32" fill="#1A1A1A"/>
  <text x="950" y="1760" text-anchor="middle" font-size="12" fill="#FFFFFF">
    <tspan x="950" dy="-4">High Tampering Risk</tspan>
    <tspan x="950" dy="16">Escalated High-Risk Flag</tspan>
  </text>

  <text x="625" y="1830" text-anchor="middle" font-size="10.5" fill="#595959">Weights shown are ForensicFusionEngine.DETECTOR_WEIGHTS (fusion_scoring.py, §11.2). The separate reviewer-facing 4-pillar display weighting</text>
  <text x="625" y="1846" text-anchor="middle" font-size="10.5" fill="#595959">(OCR 35% / Compression 25% / Sensor Continuity 25% / Metadata 15%) drives the explainability panel only, not this computation.</text>
  <text x="625" y="1862" text-anchor="middle" font-size="10.5" fill="#595959">ScanDocumentJob subsequently re-derives the authoritative classification against the configurable ai_fraud_threshold setting (default 70.0).</text>

</svg>
