  <text x="600" y="904" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#595959">Line labels: cardinality (1, 1..*) and the driving foreign-key column</text>
  <text x="100" y="928" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#595959">This is the physical relational schema (foreign-key linkage view) at table level, showing only table names and FK-driven cardinalities.</text>
  <text x="100" y="944" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#595959">It complements the attribute-level Entity-Relationship Diagram (Figure 3), which lists primary/foreign keys and column detail per entity.</text>
</svg>
