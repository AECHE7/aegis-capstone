  <text x="122" y="904" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Central hub table</text>
  <rect x="280" y="892" width="16" height="16" fill="#C77C22" stroke="#1A1A1A"/>
  <text x="302" y="904" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">AI-related table</text>
  <rect x="440" y="892" width="16" height="16" fill="#1F4E79" stroke="#1A1A1A"/>
