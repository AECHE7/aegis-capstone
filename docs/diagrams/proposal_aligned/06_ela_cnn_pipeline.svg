<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1420" fill="#FFFFFF"/>
  <text x="450" y="36" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 14. ELA-CNN Fraud Detection Pipeline Flowchart</text>

  <!-- Start -->
  <ellipse cx="450" cy="80" rx="90" ry="32" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Start</text>
  <line x1="450" y1="112" x2="450" y2="140" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 1. Load COG image -->
  <polygon points="330,140 600,140 570,200 300,200" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="174" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Load uploaded COG image</text>
  <line x1="450" y1="200" x2="450" y2="228" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Re-compress -->
  <rect x="330" y="228" width="240" height="60" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="264" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Re-compress image at JPEG Q = 95</text>
  <line x1="450" y1="288" x2="450" y2="316" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Compute ELA map -->
  <rect x="290" y="316" width="320" height="80" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Compute Error Level Analysis (ELA) map</text>
  <text x="450" y="372" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" text-anchor="middle" fill="#595959">E(x,y) = | I(x,y) &#8211; I'(x,y) |</text>
  <line x1="450" y1="396" x2="450" y2="424" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Normalize + resize -->
  <rect x="300" y="424" width="300" height="70" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Normalize ELA map to [0, 255];</text>
  <text x="450" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">resize to 224 &#215; 224 pixels</text>
  <line x1="450" y1="494" x2="450" y2="522" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. ResNet-50 CNN -->
  <rect x="280" y="522" width="340" height="70" fill="#C77C22" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="550" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">Pass ELA map through pre-trained</text>
  <text x="450" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">ResNet-50 CNN classifier &#8594; score p &#8712; [0,1]</text>
  <line x1="450" y1="592" x2="450" y2="620" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Fraud probability score -->
  <rect x="280" y="620" width="340" height="60" fill="#C77C22" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="656" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">fraud_probability_score = round(p &#215; 100)</text>
  <line x1="450" y1="680" x2="450" y2="708" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Decision -->
  <polygon points="450,708 570,778 450,848 330,778" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="774" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#1A1A1A">p &lt; 0.50 ?</text>
  <text x="450" y="792" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#595959">(classification threshold)</text>

  <!-- Yes -> Authentic -->
  <line x1="330" y1="778" x2="270" y2="858" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="820" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F4E79">Yes</text>
  <rect x="150" y="858" width="240" height="70" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/>
  <text x="270" y="888" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Classification:</text>
  <text x="270" y="906" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">Authentic</text>

  <!-- No -> Tampered -->
  <line x1="570" y1="778" x2="630" y2="858" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="820" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#A6303E">No</text>
  <rect x="510" y="858" width="240" height="70" fill="#FFFFFF" stroke="#A6303E" stroke-width="2.5"/>
  <text x="630" y="888" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Classification:</text>
  <text x="630" y="906" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#A6303E">Tampered</text>

  <!-- Converge to Grad-CAM -->
  <line x1="270" y1="928" x2="420" y2="988" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="928" x2="480" y2="988" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8a. Grad-CAM -->
  <rect x="310" y="988" width="280" height="70" fill="#C77C22" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">Apply Grad-CAM to ResNet-50's</text>
  <text x="450" y="1034" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">final convolutional layer</text>
  <line x1="450" y1="1058" x2="450" y2="1086" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8b. Overlay heatmap -->
  <rect x="310" y="1086" width="280" height="60" fill="#C77C22" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">Overlay heatmap on original image</text>
  <line x1="450" y1="1146" x2="450" y2="1174" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. Output parallelogram -->
  <polygon points="270,1174 630,1174 600,1264 240,1264" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="1204" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Return: fraud_probability_score,</text>
  <text x="450" y="1222" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">classification_label,</text>
  <text x="450" y="1240" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">gradcam_heatmap_path</text>
  <line x1="450" y1="1264" x2="450" y2="1292" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- End -->
  <ellipse cx="450" cy="1324" rx="90" ry="32" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="450" y="1330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">End</text>

  <!-- Legend -->
  <rect x="60" y="1380" width="18" height="14" fill="#C77C22" stroke="#1A1A1A"/>
  <text x="84" y="1392" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">AI / CNN processing step</text>
  <rect x="290" y="1380" width="18" height="14" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/>
  <text x="314" y="1392" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Authentic outcome</text>
  <rect x="470" y="1380" width="18" height="14" fill="#FFFFFF" stroke="#A6303E" stroke-width="2.5"/>
  <text x="494" y="1392" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Tampered outcome</text>
</svg>
