<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="40" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 2. A.E.G.I.S. System Architecture Diagram</text>

  <!-- ===================== PRESENTATION TIER ===================== -->
  <rect x="60" y="80" width="1080" height="160" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="90" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1F4E79">PRESENTATION LAYER (Browser)</text>

  <rect x="140" y="130" width="380" height="90" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="330" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Student Portal</text>
  <text x="330" y="180" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">HTML5 / CSS3 / Bootstrap 5</text>
  <text x="330" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">JavaScript</text>

  <rect x="680" y="130" width="380" height="90" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="870" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">OSA Dashboard</text>
  <text x="870" y="180" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">HTML5 / CSS3 / Bootstrap 5</text>
  <text x="870" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">JavaScript</text>

  <!-- Arrows Presentation <-> Application -->
  <line x1="330" y1="220" x2="330" y2="300" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="300" x2="360" y2="220" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="262" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">HTTPS</text>
  <text x="380" y="262" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">requests</text>

  <line x1="870" y1="220" x2="870" y2="300" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="300" x2="900" y2="220" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="262" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">HTTPS</text>
  <text x="920" y="262" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">requests</text>

  <!-- ===================== APPLICATION TIER ===================== -->
  <rect x="60" y="300" width="1080" height="290" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="90" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1F4E79">APPLICATION LAYER</text>

  <!-- Laravel backend -->
  <rect x="100" y="350" width="440" height="200" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="320" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">Laravel Web Server</text>
  <text x="320" y="396" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">PHP 8.x / Laravel 10</text>
  <line x1="130" y1="408" x2="510" y2="408" stroke="#D9D9D9" stroke-width="1"/>
  <text x="320" y="428" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">Authentication &amp; RBAC</text>
  <text x="320" y="448" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">Routing</text>
  <text x="320" y="468" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">Eloquent ORM (DB access)</text>
  <text x="320" y="488" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">SMTP Email (PHPMailer via</text>
  <text x="320" y="504" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">Laravel Mail)</text>
  <text x="320" y="532" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#595959">(handles UI requests)</text>

  <!-- Python AI microservice -->
  <rect x="640" y="350" width="440" height="200" fill="#FFFFFF" stroke="#C77C22" stroke-width="2"/>
  <text x="860" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#C77C22">Python AI Microservice</text>
  <text x="860" y="396" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">Python 3.10+</text>
  <line x1="670" y1="408" x2="1050" y2="408" stroke="#D9D9D9" stroke-width="1"/>
  <text x="860" y="428" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">TensorFlow / Keras, OpenCV</text>
  <text x="860" y="448" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">REST API endpoint dedicated</text>
  <text x="860" y="464" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">to document fraud analysis</text>
  <text x="860" y="488" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">(ELA preprocessing +</text>
  <text x="860" y="504" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">CNN inference)</text>

  <!-- Internal HTTP arrows between Laravel and Python -->
  <line x1="540" y1="400" x2="638" y2="400" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="589" y="386" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#1A1A1A">internal HTTP POST:</text>
  <text x="589" y="398" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#1A1A1A">COG file path</text>

  <line x1="638" y1="500" x2="540" y2="500" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="589" y="518" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#1A1A1A">JSON: fraud score,</text>
  <text x="589" y="530" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#1A1A1A">label, heatmap path</text>

  <!-- Arrows Application <-> Data -->
  <line x1="330" y1="590" x2="330" y2="670" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="670" x2="360" y2="590" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="632" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">Eloquent</text>
  <text x="380" y="632" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">ORM</text>

  <line x1="860" y1="590" x2="860" y2="670" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="890" y1="670" x2="890" y2="590" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="632" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">file</text>
  <text x="900" y="632" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1A1A1A">I/O</text>

  <!-- ===================== DATA TIER ===================== -->
  <rect x="60" y="670" width="1080" height="160" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="90" y="696" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1F4E79">DATA LAYER</text>

  <rect x="140" y="720" width="380" height="90" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="330" y="754" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">MySQL 8.x</text>
  <text x="330" y="774" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">Relational Database</text>
  <text x="330" y="792" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">(9 normalized entities)</text>

  <rect x="680" y="720" width="380" height="90" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="870" y="754" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Document Storage</text>
  <text x="870" y="774" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">Secure server-side folder</text>
  <text x="870" y="792" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">for uploaded document images</text>

  <!-- Legend -->
  <rect x="60" y="850" width="18" height="14" fill="#1F4E79" stroke="#1A1A1A"/>
  <text x="84" y="862" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Structural / primary component</text>
  <rect x="360" y="850" width="18" height="14" fill="#FFFFFF" stroke="#C77C22" stroke-width="2"/>
  <text x="384" y="862" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">AI / processing component</text>
</svg>
