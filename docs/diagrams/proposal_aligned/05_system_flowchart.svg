<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1340">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1340" fill="#FFFFFF"/>
  <text x="500" y="36" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 6. A.E.G.I.S. System Flowchart</text>

  <!-- Start -->
  <ellipse cx="500" cy="90" rx="90" ry="32" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Start</text>
  <line x1="500" y1="122" x2="500" y2="150" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parallelogram: submit + upload -->
  <polygon points="380,150 650,150 620,220 350,220" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Student submits application +</text>
  <text x="500" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">uploads COG (+ other documents)</text>
  <line x1="500" y1="220" x2="500" y2="248" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision 1 -->
  <polygon points="500,220 610,280 500,340 390,280" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="272" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#1A1A1A">Valid file format</text>
  <text x="500" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#1A1A1A">and size?</text>

  <!-- No branch -->
  <line x1="610" y1="280" x2="700" y2="280" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#A6303E">No</text>
  <rect x="700" y="245" width="220" height="70" fill="#FFFFFF" stroke="#A6303E" stroke-width="1.5"/>
  <text x="810" y="275" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Reject file; prompt</text>
  <text x="810" y="293" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">student to re-upload</text>
  <polyline points="810,245 810,160 655,160" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes branch -->
  <text x="516" y="368" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F4E79">Yes</text>
  <line x1="500" y1="340" x2="500" y2="378" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Store document securely -->
  <rect x="370" y="378" width="260" height="60" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Store document securely</text>
  <line x1="500" y1="438" x2="500" y2="466" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Send to AI microservice -->
  <rect x="340" y="466" width="320" height="60" fill="#C77C22" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="492" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">Send document to Python AI</text>
  <text x="500" y="510" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">microservice (internal HTTP POST)</text>
  <line x1="500" y1="526" x2="500" y2="554" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AI returns score + heatmap -->
  <polygon points="380,554 650,554 620,624 350,624" fill="#C77C22" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="584" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">AI generates fraud probability</text>
  <text x="500" y="602" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#FFFFFF">score + Grad-CAM heatmap</text>
  <line x1="500" y1="624" x2="500" y2="652" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OSA Staff reviews -->
  <rect x="320" y="652" width="360" height="80" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="680" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">OSA Staff reviews queued application</text>
  <text x="500" y="698" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">(score, risk tier, heatmap) against the</text>
  <text x="500" y="716" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">original / scanned document</text>
  <line x1="500" y1="732" x2="500" y2="760" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision 2 -->
  <polygon points="500,760 630,830 500,900 370,830" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="822" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#1A1A1A">OSA determines</text>
  <text x="500" y="838" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#1A1A1A">application status</text>

  <!-- Three branches -->
  <line x1="370" y1="830" x2="200" y2="910" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="880" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1F4E79">Approved</text>
  <rect x="100" y="910" width="200" height="60" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="200" y="945" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Status: Approved</text>

  <line x1="500" y1="900" x2="500" y2="910" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="905" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8C8C8C">Under Review</text>
  <rect x="400" y="910" width="200" height="60" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="2"/>
  <text x="500" y="937" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Status: Under</text>
  <text x="500" y="953" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Review</text>

  <line x1="630" y1="830" x2="800" y2="910" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="880" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#A6303E">Rejected</text>
  <rect x="700" y="910" width="200" height="60" fill="#FFFFFF" stroke="#A6303E" stroke-width="2"/>
  <text x="800" y="945" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Status: Rejected</text>

  <!-- Converge to Update StatusLogs -->
  <line x1="200" y1="970" x2="480" y2="1035" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="970" x2="500" y2="1035" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="970" x2="520" y2="1035" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Update StatusLogs -->
  <rect x="360" y="1035" width="280" height="60" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="1062" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Write StatusLogs entry</text>
  <text x="500" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">(timestamped, audit trail)</text>
  <line x1="500" y1="1095" x2="500" y2="1123" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Send email notification -->
  <polygon points="380,1123 650,1123 620,1193 350,1193" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="1153" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Send automated email</text>
  <text x="500" y="1171" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">notification (logged in EmailLogs)</text>
  <line x1="500" y1="1193" x2="500" y2="1221" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- End -->
  <ellipse cx="500" cy="1253" rx="90" ry="32" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="500" y="1259" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">End</text>

  <!-- Legend -->
  <rect x="60" y="1310" width="18" height="14" fill="#C77C22" stroke="#1A1A1A"/>
  <text x="84" y="1322" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">AI microservice step</text>
  <polygon points="330,1305 380,1305 372,1324 322,1324" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="392" y="1319" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Input / Output</text>
  <polygon points="560,1305 590,1315 560,1325 530,1315" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="600" y="1319" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Decision</text>
</svg>
