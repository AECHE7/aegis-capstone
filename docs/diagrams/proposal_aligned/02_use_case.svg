<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="920" fill="#FFFFFF"/>

  <text x="600" y="36" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 4. A.E.G.I.S. Core Use Case Diagram</text>

  <!-- System boundary -->
  <rect x="300" y="70" width="600" height="800" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="600" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">A.E.G.I.S. System</text>

  <!-- ============ Stick figures ============ -->
  <!-- Student actor -->
  <g>
    <circle cx="90" cy="200" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="90" y1="216" x2="90" y2="270" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="60" y1="235" x2="120" y2="235" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="90" y1="270" x2="65" y2="310" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="90" y1="270" x2="115" y2="310" stroke="#1A1A1A" stroke-width="2"/>
    <text x="90" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Student</text>
  </g>

  <!-- OSA Staff actor -->
  <g>
    <circle cx="90" cy="480" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="90" y1="496" x2="90" y2="550" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="60" y1="515" x2="120" y2="515" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="90" y1="550" x2="65" y2="590" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="90" y1="550" x2="115" y2="590" stroke="#1A1A1A" stroke-width="2"/>
    <text x="90" y="610" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1A1A1A">OSA Staff</text>
    <text x="90" y="626" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#595959">(Administrator)</text>
  </g>

  <!-- Super Administrator actor -->
  <g>
    <circle cx="1110" cy="200" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="1110" y1="216" x2="1110" y2="270" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="1080" y1="235" x2="1140" y2="235" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="1110" y1="270" x2="1085" y2="310" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="1110" y1="270" x2="1135" y2="310" stroke="#1A1A1A" stroke-width="2"/>
    <text x="1110" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Super</text>
    <text x="1110" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Administrator</text>
  </g>

  <!-- ============ Use case ellipses ============ -->
  <!-- Student use cases -->
  <ellipse cx="470" cy="130" rx="120" ry="34" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="470" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Register / Login</text>

  <ellipse cx="470" cy="220" rx="140" ry="36" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="470" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Submit Scholarship</text>
  <text x="470" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Application</text>

  <ellipse cx="470" cy="320" rx="130" ry="36" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="470" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Upload Documents</text>
  <text x="470" y="332" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#595959">(COG / ITR / ID)</text>

  <ellipse cx="470" cy="410" rx="130" ry="34" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="470" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Track Application</text>
  <text x="470" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Status</text>

  <!-- include arrow -->
  <line x1="470" y1="256" x2="470" y2="284" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="540" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" text-anchor="middle" fill="#1A1A1A">&#171;include&#187;</text>

  <!-- Student -> use cases -->
  <line x1="120" y1="200" x2="350" y2="130" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="215" x2="330" y2="220" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="240" x2="345" y2="320" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="260" x2="345" y2="410" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- OSA Staff use cases -->
  <ellipse cx="600" cy="500" rx="150" ry="34" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="600" y="496" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Review Application</text>
  <text x="600" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Submissions</text>

  <ellipse cx="600" cy="590" rx="170" ry="42" fill="#FFFFFF" stroke="#C77C22" stroke-width="2"/>
  <text x="600" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Verify AI Fraud</text>
  <text x="600" y="596" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Detection Result</text>
  <text x="600" y="611" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#595959">(score, risk tier, heatmap)</text>

  <ellipse cx="600" cy="690" rx="170" ry="42" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="600" y="680" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Update Application</text>
  <text x="600" y="696" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Status</text>
  <text x="600" y="711" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#595959">(Approved / Under Review / Rejected)</text>

  <ellipse cx="600" cy="790" rx="170" ry="42" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="600" y="780" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Generate Compliance /</text>
  <text x="600" y="796" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Report Documents</text>
  <text x="600" y="811" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#595959">(CSV / PDF export)</text>

  <!-- OSA Staff -> use cases -->
  <line x1="120" y1="470" x2="450" y2="500" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="490" x2="430" y2="590" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="510" x2="430" y2="690" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="120" y1="530" x2="430" y2="790" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Super Administrator use cases -->
  <ellipse cx="800" cy="200" rx="150" ry="36" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="800" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Manage User</text>
  <text x="800" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Accounts</text>

  <ellipse cx="800" cy="300" rx="150" ry="36" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="800" y="296" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Configure Scholarship</text>
  <text x="800" y="312" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">Programs</text>

  <!-- Super Admin -> use cases -->
  <line x1="1080" y1="210" x2="950" y2="200" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="1080" y1="230" x2="950" y2="300" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Note -->
  <text x="600" y="908" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#595959">Each actor's access to use cases is strictly bounded by Role-Based Access Control (RBAC).</text>

  <!-- Legend -->
  <ellipse cx="330" cy="880" rx="10" ry="7" fill="#FFFFFF" stroke="#C77C22" stroke-width="2"/>
  <text x="350" y="884" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">AI-related use case</text>
  <line x1="620" y1="880" x2="660" y2="880" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="670" y="884" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#1A1A1A">&#171;include&#187; dependency</text>
</svg>
