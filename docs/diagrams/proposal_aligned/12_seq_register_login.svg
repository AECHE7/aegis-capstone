<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 850">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1A1A1A" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1150" height="850" fill="#FFFFFF"/>
  <text x="575" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 20. Sequence Diagram - Student Registration and Login</text>

  <!-- Lifelines -->
  <line x1="140" y1="110" x2="140" y2="700" stroke="#8C8C8C" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="430" y1="110" x2="430" y2="700" stroke="#8C8C8C" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="720" y1="110" x2="720" y2="700" stroke="#8C8C8C" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="990" y1="110" x2="990" y2="700" stroke="#8C8C8C" stroke-width="1.3" stroke-dasharray="4,4"/>

  <!-- Participant headers -->
  <rect x="40" y="60" width="200" height="50" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/>
  <text x="140" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Student (Browser)</text>

  <rect x="330" y="60" width="200" height="50" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="430" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Laravel Backend</text>

  <rect x="620" y="60" width="200" height="50" fill="#595959" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="720" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Users (Database)</text>

  <rect x="890" y="60" width="200" height="50" fill="#8C8C8C" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="990" y="84" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Email Service</text>
  <text x="990" y="100" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#FFFFFF">(SMTP)</text>

  <!-- Activation bars -->
  <rect x="425" y="150" width="10" height="262" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="425" y="472" width="10" height="168" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="716" y="270" width="8" height="30" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="716" y="502" width="8" height="30" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="986" y="336" width="8" height="20" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="1"/>

  <!-- 1: Student submits registration form -->
  <text x="285" y="144" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">1: Submit registration form (name, email, password)</text>
  <line x1="140" y1="150" x2="425" y2="150" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2: Laravel validates input (self-message) -->
  <polyline points="435,190 500,190 500,220 435,220" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">2: Validate input</text>
  <text x="510" y="212" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">(server-side rules)</text>

  <!-- 3: Laravel creates record -> Users -->
  <text x="575" y="264" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">3: Create Users record (role = Student)</text>
  <line x1="435" y1="270" x2="716" y2="270" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4: Users returns confirmation (dashed) -->
  <text x="575" y="294" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">4: Confirmation (record created)</text>
  <line x1="716" y1="300" x2="435" y2="300" stroke="#1A1A1A" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- 5: Laravel dispatches verification email -> Email Service -->
  <text x="710" y="330" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">5: Dispatch verification email</text>
  <line x1="435" y1="336" x2="986" y2="336" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6: Student clicks verification link -->
  <text x="285" y="366" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">6: Clicks verification link</text>
  <line x1="140" y1="372" x2="425" y2="372" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7: Laravel updates account status -> Users -->
  <text x="575" y="396" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">7: Update account status (activate)</text>
  <line x1="435" y1="402" x2="716" y2="402" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Divider -->
  <line x1="40" y1="436" x2="1090" y2="436" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="2,4"/>
  <rect x="465" y="422" width="220" height="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
  <text x="575" y="438" font-family="Arial, Helvetica, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#1A1A1A">Later - student logs in</text>

  <!-- 8: Student submits credentials -->
  <text x="285" y="466" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">8: Submit credentials (email, password)</text>
  <line x1="140" y1="472" x2="425" y2="472" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9: Laravel queries -> Users -->
  <text x="575" y="496" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">9: Query Users record by email</text>
  <line x1="435" y1="502" x2="716" y2="502" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 10: Users returns record (dashed) -->
  <text x="575" y="526" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">10: Return matched user record</text>
  <line x1="716" y1="532" x2="435" y2="532" stroke="#1A1A1A" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- 11: Laravel verifies password hash (self-message) -->
  <polyline points="435,562 500,562 500,592 435,592" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="568" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">11: Verify password</text>
  <text x="510" y="584" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">hash (bcrypt verify)</text>

  <!-- 12: Laravel creates session and redirects (dashed return) -->
  <text x="285" y="618" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#1A1A1A">12: Create session; redirect</text>
  <text x="285" y="632" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#595959">(role-based redirect)</text>
  <line x1="425" y1="640" x2="140" y2="640" stroke="#1A1A1A" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>

  <!-- Legend -->
  <line x1="60" y1="740" x2="120" y2="740" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="744" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Synchronous call</text>
  <line x1="300" y1="740" x2="360" y2="740" stroke="#1A1A1A" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="370" y="744" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Return</text>
  <rect x="470" y="732" width="10" height="16" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="1"/>
  <text x="490" y="744" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1A1A1A">Activation bar</text>
</svg>
