<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000">
  <rect x="0" y="0" width="1200" height="1000" fill="#FFFFFF"/>

  <text x="600" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">Figure 27. Defense-in-Depth Security Architecture</text>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#595959">Layered controls implemented in A.E.G.I.S. (Chapter 16) — outer network-facing layers to inner data-protection layers</text>

  <!-- Nested layers, largest (outer) drawn first, smaller (inner) drawn on top -->
  <!-- Layer 1: Network & Transport -->
  <rect x="60" y="110" width="1080" height="870" rx="4" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Layer 2: HTTP Security Headers & CSP -->
  <rect x="135" y="165" width="930" height="760" rx="4" fill="#C77C22" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Layer 3: Session & CSRF Protection -->
  <rect x="210" y="220" width="780" height="650" rx="4" fill="#595959" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Layer 4: Authentication & MFA -->
  <rect x="285" y="275" width="630" height="540" rx="4" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Layer 5: Authorization / RBAC -->
  <rect x="360" y="330" width="480" height="430" rx="4" fill="#C77C22" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Layer 6: Data-at-Rest Encryption -->
  <rect x="435" y="385" width="330" height="320" rx="4" fill="#595959" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Innermost: Protected Asset -->
  <rect x="500" y="455" width="200" height="180" rx="6" fill="#A6303E" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Layer 1 label -->
  <text x="600" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Layer 1 — Network &amp; Transport</text>
  <text x="600" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">HTTPS / TLS (Strict-Transport-Security header) &#183; Render hosting platform</text>

  <!-- Layer 2 label -->
  <text x="600" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Layer 2 — HTTP Security Headers &amp; CSP</text>
  <text x="600" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">SecurityHeaders middleware — CSP, X-Frame-Options, X-Content-Type-Options</text>

  <!-- Layer 3 label -->
  <text x="600" y="241" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Layer 3 — Session &amp; CSRF Protection</text>
  <text x="600" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Database session driver &#183; graceful TokenMismatchException handling</text>

  <!-- Layer 4 label -->
  <text x="600" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Layer 4 — Authentication &amp; MFA</text>
  <text x="600" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">6-digit OTP &#183; 30-day trusted-device token (UA-hash bound)</text>

  <!-- Layer 5 label -->
  <text x="600" y="351" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Layer 5 — Authorization / RBAC</text>
  <text x="600" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">CheckRole middleware &#183; CheckUserActive (deactivation lockout)</text>

  <!-- Layer 6 label (taller strip, split into two detail lines) -->
  <text x="600" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Layer 6 — Data-at-Rest Encryption</text>
  <text x="600" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">AES-256-CBC encrypted casts</text>
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">(StudentProfile, ApplicationField)</text>

  <!-- Center asset -->
  <text x="600" y="538" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">PROTECTED ASSET</text>
  <text x="600" y="556" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF">Student &amp; Financial Data</text>

  <text x="600" y="975" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8C8C8C">Source: A.E.G.I.S. System Documentation, Chapter 16 — Security Architecture</text>
</svg>
