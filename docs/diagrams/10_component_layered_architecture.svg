<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C8C8C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="1000" fill="#FFFFFF"/>
  <text x="650" y="34" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Figure 10. Layered / Component Architecture Diagram</text>

  <!-- Layout constants -->
  <!-- bands from y=70 to y=870, 5 bands each 140 tall with 20 gap => 160 pitch -->
  <!-- band x range: 130 to 1030 ; side arrows column at x 1060-1180 -->

  <!-- ===== Band 1: Presentation Layer ===== -->
  <rect x="130" y="70" width="900" height="140" rx="8" fill="#1F4E79" fill-opacity="0.10" stroke="#1F4E79" stroke-width="2"/>
  <text x="150" y="94" font-size="13" font-weight="bold" fill="#1F4E79">Presentation Layer</text>
  <rect x="160" y="106" width="230" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="275" y="140" font-size="12" fill="#FFFFFF" text-anchor="middle">Blade Views</text>
  <text x="275" y="158" font-size="10" fill="#FFFFFF" text-anchor="middle">(server-rendered HTML)</text>
  <text x="275" y="174" font-size="10" fill="#FFFFFF" text-anchor="middle">Bootstrap 5 / Alpine.js</text>

  <rect x="410" y="106" width="230" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="525" y="140" font-size="12" fill="#FFFFFF" text-anchor="middle">Vite Assets</text>
  <text x="525" y="158" font-size="10" fill="#FFFFFF" text-anchor="middle">CSS / JS bundles</text>
  <text x="525" y="174" font-size="10" fill="#FFFFFF" text-anchor="middle">Tailwind CSS build pipeline</text>

  <rect x="660" y="106" width="330" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="825" y="140" font-size="12" fill="#FFFFFF" text-anchor="middle">Progressive Web App shell</text>
  <text x="825" y="158" font-size="10" fill="#FFFFFF" text-anchor="middle">manifest.json + service worker (sw.js)</text>
  <text x="825" y="174" font-size="10" fill="#FFFFFF" text-anchor="middle">Network-first HTML caching, offline banner</text>

  <!-- ===== Band 2: Routing & Middleware Layer ===== -->
  <rect x="130" y="230" width="900" height="140" rx="8" fill="#A6303E" fill-opacity="0.08" stroke="#A6303E" stroke-width="2"/>
  <text x="150" y="254" font-size="13" font-weight="bold" fill="#A6303E">Routing &amp; Middleware Layer</text>
  <rect x="160" y="266" width="180" height="86" rx="6" fill="#A6303E" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="250" y="298" font-size="11.5" fill="#FFFFFF" text-anchor="middle">routes/web.php</text>
  <text x="250" y="316" font-size="10" fill="#FFFFFF" text-anchor="middle">auth / role-scoped</text>
  <text x="250" y="330" font-size="10" fill="#FFFFFF" text-anchor="middle">route groups</text>

  <rect x="360" y="266" width="150" height="86" rx="6" fill="#A6303E" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="435" y="292" font-size="11" fill="#FFFFFF" text-anchor="middle">CheckRole</text>
  <text x="435" y="308" font-size="11" fill="#FFFFFF" text-anchor="middle">CheckUserActive</text>
  <text x="435" y="336" font-size="9.5" fill="#FFFFFF" text-anchor="middle">authorization</text>

  <rect x="530" y="266" width="150" height="86" rx="6" fill="#A6303E" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="605" y="292" font-size="11" fill="#FFFFFF" text-anchor="middle">SecurityHeaders</text>
  <text x="605" y="308" font-size="11" fill="#FFFFFF" text-anchor="middle">GzipResponse</text>
  <text x="605" y="336" font-size="9.5" fill="#FFFFFF" text-anchor="middle">CSP / compression</text>

  <rect x="700" y="266" width="290" height="86" rx="6" fill="#A6303E" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="845" y="298" font-size="11" fill="#FFFFFF" text-anchor="middle">SetLocale</text>
  <text x="845" y="316" font-size="10" fill="#FFFFFF" text-anchor="middle">per-session language selection</text>
  <text x="845" y="332" font-size="9.5" fill="#FFFFFF" text-anchor="middle">(registered globally in bootstrap/app.php)</text>

  <!-- ===== Band 3: Controller Layer ===== -->
  <rect x="130" y="390" width="900" height="140" rx="8" fill="#1F4E79" fill-opacity="0.10" stroke="#1F4E79" stroke-width="2"/>
  <text x="150" y="414" font-size="13" font-weight="bold" fill="#1F4E79">Controller Layer</text>
  <rect x="160" y="426" width="165" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="242" y="474" font-size="11.5" fill="#FFFFFF" text-anchor="middle">AuthController</text>

  <rect x="335" y="426" width="165" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="417" y="474" font-size="11.5" fill="#FFFFFF" text-anchor="middle">ApplicationController</text>

  <rect x="510" y="426" width="165" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="592" y="464" font-size="11.5" fill="#FFFFFF" text-anchor="middle">AdminController</text>
  <text x="592" y="482" font-size="11.5" fill="#FFFFFF" text-anchor="middle">SuperAdminController</text>

  <rect x="685" y="426" width="165" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="767" y="474" font-size="11.5" fill="#FFFFFF" text-anchor="middle">DocumentController</text>

  <rect x="860" y="426" width="130" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="925" y="464" font-size="10.5" fill="#FFFFFF" text-anchor="middle">ReportController</text>
  <text x="925" y="482" font-size="10.5" fill="#FFFFFF" text-anchor="middle">(+ 7 others)</text>

  <!-- ===== Band 4: Service / Job Layer ===== -->
  <rect x="130" y="550" width="900" height="180" rx="8" fill="#C77C22" fill-opacity="0.10" stroke="#C77C22" stroke-width="2"/>
  <text x="150" y="574" font-size="13" font-weight="bold" fill="#C77C22">Service / Job Layer</text>

  <text x="160" y="596" font-size="10.5" font-weight="bold" fill="#595959">Services</text>
  <rect x="160" y="602" width="425" height="56" rx="6" fill="#C77C22" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="372" y="624" font-size="10.5" fill="#FFFFFF" text-anchor="middle">ApplicationAssignmentService &#183; ApplicationAutoApprovalService</text>
  <text x="372" y="642" font-size="10.5" fill="#FFFFFF" text-anchor="middle">AIVerificationService &#183; CloudStorageService &#183; AuditLoggerService</text>

  <rect x="605" y="602" width="425" height="56" rx="6" fill="#C77C22" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="817" y="624" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Jobs (async, database queue)</text>
  <text x="817" y="642" font-size="10.5" fill="#FFFFFF" text-anchor="middle">ScanDocumentJob &#183; BroadcastAnnouncementEmailJob</text>

  <line x1="585" y1="630" x2="605" y2="630" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="620" font-size="8" fill="#595959"></text>

  <rect x="160" y="672" width="870" height="42" rx="6" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="595" y="698" font-size="10" fill="#595959" text-anchor="middle">HTTP call out to aegis-ai microservice (ScanDocumentJob &#8594; /analyze-document), retry/backoff on cold start</text>

  <!-- ===== Band 5: Model / Data Layer ===== -->
  <rect x="130" y="750" width="900" height="140" rx="8" fill="#1F4E79" fill-opacity="0.10" stroke="#1F4E79" stroke-width="2"/>
  <text x="150" y="774" font-size="13" font-weight="bold" fill="#1F4E79">Model / Data Layer</text>
  <rect x="160" y="786" width="480" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="400" y="818" font-size="11.5" fill="#FFFFFF" text-anchor="middle">Eloquent Models</text>
  <text x="400" y="836" font-size="10" fill="#FFFFFF" text-anchor="middle">User, Application, Document, AIResult, Scholarship, ...</text>
  <text x="400" y="852" font-size="9.5" fill="#FFFFFF" text-anchor="middle">(19 models, app/Models/)</text>

  <line x1="640" y1="829" x2="700" y2="829" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="786" width="290" height="86" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="845" y="818" font-size="11.5" fill="#FFFFFF" text-anchor="middle">Database</text>
  <text x="845" y="836" font-size="10" fill="#FFFFFF" text-anchor="middle">SQLite (dev) / PostgreSQL (staging &amp; prod)</text>
  <text x="845" y="852" font-size="9.5" fill="#FFFFFF" text-anchor="middle">accessed exclusively via Eloquent</text>

  <!-- ===== Inter-band vertical connectors (top to bottom, center) ===== -->
  <line x1="580" y1="210" x2="580" y2="230" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="370" x2="580" y2="390" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="530" x2="580" y2="550" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="730" x2="580" y2="750" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Side arrows: request flow down (thick) and response flow up (thin) ===== -->
  <text x="1130" y="60" font-size="11.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Request Flow</text>

  <!-- downward thick arrow -->
  <line x1="1095" y1="80" x2="1095" y2="870" stroke="#1A1A1A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1075" y="470" font-size="11" fill="#1A1A1A" text-anchor="middle" transform="rotate(-90 1075 470)">Incoming HTTP request</text>

  <!-- upward thin return arrow -->
  <line x1="1160" y1="870" x2="1160" y2="80" stroke="#8C8C8C" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="1180" y="470" font-size="11" fill="#8C8C8C" text-anchor="middle" transform="rotate(-90 1180 470)">Response / rendered view</text>

  <!-- Legend -->
  <rect x="40" y="915" width="1220" height="70" rx="10" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.5"/>
  <rect x="60" y="928" width="18" height="14" fill="#1F4E79"/>
  <text x="84" y="940" font-size="10.5" fill="#1A1A1A">Presentation / Controller / Model layers</text>
  <rect x="330" y="928" width="18" height="14" fill="#A6303E"/>
  <text x="354" y="940" font-size="10.5" fill="#1A1A1A">Routing &amp; Middleware (security-sensitive)</text>
  <rect x="590" y="928" width="18" height="14" fill="#C77C22"/>
  <text x="614" y="940" font-size="10.5" fill="#1A1A1A">Service &amp; Job layer (business logic / background processing)</text>
  <text x="60" y="962" font-size="10" fill="#595959">Each band represents a horizontal architectural tier; a request traverses top-to-bottom, a response returns bottom-to-top.</text>
</svg>
