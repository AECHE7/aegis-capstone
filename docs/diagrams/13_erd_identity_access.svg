    <text x="730" y="111" font-size="10" fill="#595959">bigint, auto-inc</text>
    <text x="866" y="111" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">PK</text>
    <text x="632" y="137" font-size="11" fill="#1A1A1A">user_id</text>
    <text x="730" y="137" font-size="10" fill="#595959">bigint, 1:1</text>
    <text x="866" y="137" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">FK</text>
    <text x="632" y="163" font-size="11" fill="#1A1A1A">clsu_id_number</text>
    <text x="730" y="163" font-size="10" fill="#595959">encrypted, unique</text>
    <text x="632" y="189" font-size="11" fill="#1A1A1A">college</text>
    <text x="730" y="189" font-size="10" fill="#595959">string(255)</text>
    <text x="632" y="215" font-size="11" fill="#1A1A1A">course</text>
    <text x="730" y="215" font-size="10" fill="#595959">string(255)</text>
    <text x="632" y="241" font-size="11" fill="#1A1A1A">year_level</text>
    <text x="730" y="241" font-size="10" fill="#595959">string(255)</text>
    <line x1="620" y1="94" x2="880" y2="94" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="120" x2="880" y2="120" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="146" x2="880" y2="146" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="172" x2="880" y2="172" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="198" x2="880" y2="198" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="224" x2="880" y2="224" stroke="#1A1A1A" stroke-width="1"/>
  </g>

  <!-- ============ ENTITY: user_mfa_devices (x=620,y=290,w=260,h=164) ============ -->
  <g>
    <rect x="620" y="290" width="260" height="164" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="620" y="290" width="260" height="34" fill="#A6303E"/>
    <text x="750" y="312" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">user_mfa_devices</text>
    <rect x="620" y="350" width="260" height="26" fill="#D9D9D9"/>
    <rect x="620" y="402" width="260" height="26" fill="#D9D9D9"/>
    <text x="632" y="341" font-size="11" fill="#1A1A1A">id</text>
    <text x="730" y="341" font-size="10" fill="#595959">bigint, auto-inc</text>
    <text x="866" y="341" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">PK</text>
    <text x="632" y="367" font-size="11" fill="#1A1A1A">user_id</text>
    <text x="730" y="367" font-size="10" fill="#595959">bigint</text>
    <text x="866" y="367" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">FK</text>
    <text x="632" y="393" font-size="11" fill="#1A1A1A">device_token</text>
    <text x="730" y="393" font-size="10" fill="#595959">string, unique</text>
    <text x="632" y="419" font-size="11" fill="#1A1A1A">user_agent_hash</text>
    <text x="730" y="419" font-size="10" fill="#595959">string</text>
    <text x="632" y="445" font-size="11" fill="#1A1A1A">expires_at</text>
    <text x="730" y="445" font-size="10" fill="#595959">timestamp, +30d</text>
    <line x1="620" y1="324" x2="880" y2="324" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="350" x2="880" y2="350" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="376" x2="880" y2="376" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="402" x2="880" y2="402" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="428" x2="880" y2="428" stroke="#1A1A1A" stroke-width="1"/>
  </g>

  <!-- ============ ENTITY: user_invitations (x=620,y=494,w=260,h=138) ============ -->
  <g>
    <rect x="620" y="494" width="260" height="138" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="620" y="494" width="260" height="34" fill="#A6303E"/>
    <text x="750" y="516" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">user_invitations</text>
    <rect x="620" y="554" width="260" height="26" fill="#D9D9D9"/>
    <rect x="620" y="606" width="260" height="26" fill="#D9D9D9"/>
    <text x="632" y="545" font-size="11" fill="#1A1A1A">id</text>
    <text x="730" y="545" font-size="10" fill="#595959">bigint, auto-inc</text>
    <text x="866" y="545" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">PK</text>
    <text x="632" y="571" font-size="11" fill="#1A1A1A">user_id</text>
    <text x="730" y="571" font-size="10" fill="#595959">bigint</text>
    <text x="866" y="571" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">FK</text>
    <text x="632" y="597" font-size="11" fill="#1A1A1A">token</text>
    <text x="730" y="597" font-size="10" fill="#595959">string, unique</text>
    <text x="632" y="623" font-size="11" fill="#1A1A1A">expires_at</text>
    <text x="730" y="623" font-size="10" fill="#595959">timestamp</text>
    <line x1="620" y1="528" x2="880" y2="528" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="554" x2="880" y2="554" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="580" x2="880" y2="580" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="606" x2="880" y2="606" stroke="#1A1A1A" stroke-width="1"/>
  </g>

  <text x="70" y="738" font-size="10.5" fill="#595959" font-style="italic">Every User optionally owns one StudentProfile and one UserInvitation record, and zero or more trusted UserMfaDevice entries (30-day OTP trust window).</text>
  <text x="70" y="756" font-size="10.5" fill="#595959" font-style="italic">On-delete behavior for all three relationships: cascade (deleting a User removes its dependent identity records).</text>
</svg>
