<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="980" height="780" fill="#FFFFFF"/>
  <text x="490" y="34" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Figure 13. Entity-Relationship Diagram &#8212; Identity &amp; Access Module</text>

  <!-- ============ RELATIONSHIP LINES (drawn first, under boxes) ============ -->
  <line x1="200" y1="346" x2="750" y2="155" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="290" font-size="10.5" fill="#1A1A1A">1</text>
  <text x="596" y="203" font-size="10.5" fill="#1A1A1A">0..1</text>

  <line x1="200" y1="346" x2="750" y2="372" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="349" font-size="10.5" fill="#1A1A1A">1</text>
  <text x="596" y="361" font-size="10.5" fill="#1A1A1A">0..*</text>

  <line x1="200" y1="346" x2="750" y2="563" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="401" font-size="10.5" fill="#1A1A1A">1</text>
  <text x="596" y="500" font-size="10.5" fill="#1A1A1A">0..1</text>

  <!-- ============ ENTITY: users (x=70,y=251,w=260,h=190) ============ -->
  <g>
    <rect x="70" y="251" width="260" height="190" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="70" y="251" width="260" height="34" fill="#A6303E"/>
    <text x="200" y="273" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">users</text>
    <rect x="70" y="311" width="260" height="26" fill="#D9D9D9"/>
    <rect x="70" y="363" width="260" height="26" fill="#D9D9D9"/>
    <rect x="70" y="415" width="260" height="26" fill="#D9D9D9"/>
    <text x="82" y="302" font-size="11" fill="#1A1A1A">id</text>
    <text x="180" y="302" font-size="10" fill="#595959">bigint, auto-inc</text>
    <text x="316" y="302" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">PK</text>
    <text x="82" y="328" font-size="11" fill="#1A1A1A">name</text>
    <text x="180" y="328" font-size="10" fill="#595959">string(255)</text>
    <text x="82" y="354" font-size="11" fill="#1A1A1A">email</text>
    <text x="180" y="354" font-size="10" fill="#595959">string, unique</text>
    <text x="82" y="380" font-size="11" fill="#1A1A1A">role</text>
    <text x="180" y="380" font-size="10" fill="#595959">student/admin/superadmin</text>
    <text x="82" y="406" font-size="11" fill="#1A1A1A">is_active</text>
    <text x="180" y="406" font-size="10" fill="#595959">boolean, default true</text>
    <text x="82" y="432" font-size="11" fill="#1A1A1A">deleted_at</text>
    <text x="180" y="432" font-size="10" fill="#595959">timestamp, soft delete</text>
    <line x1="70" y1="285" x2="330" y2="285" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="311" x2="330" y2="311" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="337" x2="330" y2="337" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="363" x2="330" y2="363" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="389" x2="330" y2="389" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="415" x2="330" y2="415" stroke="#1A1A1A" stroke-width="1"/>
  </g>

  <!-- ============ ENTITY: student_profiles (x=620,y=60,w=260,h=190) ============ -->
  <g>
    <rect x="620" y="60" width="260" height="190" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="620" y="60" width="260" height="34" fill="#A6303E"/>
    <text x="750" y="82" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">student_profiles</text>
    <rect x="620" y="120" width="260" height="26" fill="#D9D9D9"/>
    <rect x="620" y="172" width="260" height="26" fill="#D9D9D9"/>
