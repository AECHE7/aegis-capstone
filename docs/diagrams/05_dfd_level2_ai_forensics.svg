<text x="650" y="40" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 5. Data Flow Diagram &#8212; Level 2 (Decomposition of Process 2.0: Document Forensic Verification)</text>

