<text x="840" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Decision</text>

<ellipse cx="1130" cy="330" rx="120" ry="70" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
