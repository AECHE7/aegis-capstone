<line x1="580" y1="520" x2="780" y2="520" stroke="#1A1A1A" stroke-width="2"/>
<line x1="580" y1="580" x2="780" y2="580" stroke="#1A1A1A" stroke-width="2"/>
<text x="680" y="555" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">D3 ai_results</text>

<line x1="840" y1="520" x2="1040" y2="520" stroke="#1A1A1A" stroke-width="2"/>
<line x1="840" y1="580" x2="1040" y2="580" stroke="#1A1A1A" stroke-width="2"/>
<text x="940" y="555" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1A1A1A">D4 status_logs</text>

<line x1="1080" y1="520" x2="1260" y2="520" stroke="#1A1A1A" stroke-width="2"/>
