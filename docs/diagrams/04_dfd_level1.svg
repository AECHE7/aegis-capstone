<!-- 4.0 -> Student -->
<path d="M 1080,270 C 700,60 300,60 200,100" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="70" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#1A1A1A">status notification (email + in-app)</text>

<!-- OSA Director -> 1.0 -->
<path d="M 1090,738 C 900,600 400,600 260,370" fill="none" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="640" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#1A1A1A">scholarship / term configuration</text>

<!-- 3.0 -> OSA Director -->
<line x1="900" y1="382" x2="1080" y2="738" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="935" y="620" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#1A1A1A">audit trail + analytics</text>
