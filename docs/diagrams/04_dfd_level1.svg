<line x1="340" y1="330" x2="400" y2="330" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="345" y="320" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" fill="#1A1A1A">uploaded document(s)</text>

