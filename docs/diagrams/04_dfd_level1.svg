<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
</marker>
</defs>

<text x="650" y="40" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 4. Data Flow Diagram &#8212; Level 1 (Major System Processes)</text>

<!-- External entities -->
<rect x="40" y="100" width="200" height="75" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="140" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Student</text>

<rect x="1060" y="100" width="200" height="75" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="1160" y="135" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">OSA Staff</text>
<text x="1160" y="152" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" fill="#595959">(Reviewer)</text>

<rect x="1060" y="740" width="200" height="75" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="1160" y="774" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">OSA Director /</text>
<text x="1160" y="791" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Super Admin</text>

<rect x="40" y="740" width="220" height="75" fill="#FFFFFF" stroke="#C77C22" stroke-width="3"/>
<text x="150" y="774" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">AI Forensics</text>
<text x="150" y="791" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Microservice</text>

<!-- Processes -->
<ellipse cx="220" cy="330" rx="120" ry="70" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
