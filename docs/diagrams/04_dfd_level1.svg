<text x="220" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Manage Student</text>
<text x="220" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Application</text>

<ellipse cx="530" cy="330" rx="130" ry="70" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
<text x="530" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">2.0</text>
<text x="530" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Verify Document</text>
<text x="530" y="356" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Authenticity</text>
<text x="530" y="372" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" text-anchor="middle" fill="#D9D9D9">(see Figure 5)</text>

<ellipse cx="840" cy="330" rx="120" ry="70" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
