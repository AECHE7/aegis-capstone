<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A6303E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="900" fill="#FFFFFF"/>
  <text x="650" y="36" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Figure 9. Deployment Diagram</text>

  <!-- helper function pattern: node = offset rect (depth) + main rect + stereotype + name -->

  <!-- ============ CLIENT DEVICE NODE ============ -->
  <rect x="90" y="100" width="240" height="120" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="80" y="90" width="240" height="120" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="200" y="116" font-size="11" fill="#595959" text-anchor="middle" font-style="italic">&#171;device&#187;</text>
  <text x="200" y="136" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Client Device</text>
  <line x1="98" y1="146" x2="302" y2="146" stroke="#D9D9D9" stroke-width="1"/>
  <text x="200" y="166" font-size="11" fill="#1A1A1A" text-anchor="middle">Web Browser</text>
  <text x="200" y="182" font-size="10" fill="#595959" text-anchor="middle">(Installed PWA, service worker)</text>
  <text x="200" y="198" font-size="10" fill="#595959" text-anchor="middle">Student / OSA Staff / Director</text>

  <!-- ============ RENDER.COM NODE (outer) ============ -->
  <rect x="530" y="90" width="420" height="330" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="520" y="80" width="420" height="330" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="730" y="106" font-size="11" fill="#595959" text-anchor="middle" font-style="italic">&#171;cloud host&#187;</text>
  <text x="730" y="126" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Render.com (Singapore region)</text>
  <line x1="538" y1="136" x2="922" y2="136" stroke="#D9D9D9" stroke-width="1"/>

  <!-- nested: Laravel web service node -->
  <rect x="548" y="156" width="180" height="130" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
  <text x="638" y="176" font-size="10" fill="#FFFFFF" text-anchor="middle" font-style="italic">&#171;server, Docker&#187;</text>
  <text x="638" y="194" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Laravel 12 App</text>
  <line x1="558" y1="202" x2="718" y2="202" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <text x="638" y="220" font-size="9.5" fill="#FFFFFF" text-anchor="middle">php:8.4-fpm-alpine</text>
  <text x="638" y="234" font-size="9.5" fill="#FFFFFF" text-anchor="middle">artisan serve + queue:work</text>
  <text x="638" y="248" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Port 10000, plan: free</text>
  <text x="638" y="264" font-size="9.5" fill="#FFFFFF" text-anchor="middle">1GB persistent disk</text>
  <text x="638" y="278" font-size="9.5" fill="#FFFFFF" text-anchor="middle">(aegis_uploads_disk)</text>

  <!-- nested: PostgreSQL node -->
  <rect x="748" y="156" width="172" height="130" rx="6" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
  <text x="834" y="176" font-size="10" fill="#FFFFFF" text-anchor="middle" font-style="italic">&#171;database&#187;</text>
  <text x="834" y="194" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text>
  <line x1="758" y1="202" x2="910" y2="202" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <text x="834" y="220" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Hosted via Supabase</text>
  <text x="834" y="236" font-size="9.5" fill="#FFFFFF" text-anchor="middle">(staging &amp; production)</text>
  <text x="834" y="256" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Sessions, cache, queue jobs,</text>
  <text x="834" y="270" font-size="9.5" fill="#FFFFFF" text-anchor="middle">and app data all persisted here</text>

  <!-- connector laravel <-> postgres -->
  <line x1="728" y1="221" x2="748" y2="221" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="738" y="215" font-size="8.5" fill="#FFFFFF" text-anchor="middle"></text>

  <text x="730" y="308" font-size="10" fill="#595959" text-anchor="middle">tracks `staging` branch (render.yaml, type: web, env: docker)</text>
  <text x="730" y="324" font-size="10" fill="#595959" text-anchor="middle">healthCheckPath: /api/health-check</text>
  <text x="730" y="340" font-size="10" fill="#595959" text-anchor="middle">APP_ENV=production, LOG_CHANNEL=stderr</text>
  <text x="730" y="356" font-size="10" fill="#595959" text-anchor="middle">SESSION_DRIVER=database, QUEUE_CONNECTION=database</text>
  <text x="730" y="372" font-size="10" fill="#595959" text-anchor="middle">CACHE_STORE=file, FILESYSTEM_DISK=public</text>

  <!-- ============ HUGGING FACE SPACES NODE ============ -->
  <rect x="1050" y="100" width="220" height="180" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="1040" y="90" width="220" height="180" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="1150" y="116" font-size="11" fill="#595959" text-anchor="middle" font-style="italic">&#171;server, Docker&#187;</text>
  <text x="1150" y="136" font-size="12.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Hugging Face Space</text>
  <line x1="1058" y1="146" x2="1242" y2="146" stroke="#D9D9D9" stroke-width="1"/>
  <rect x="1058" y="158" width="184" height="94" rx="6" fill="#C77C22" stroke="#1A1A1A" stroke-width="2"/>
  <text x="1150" y="178" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">aegis-ai service</text>
  <text x="1150" y="196" font-size="9.5" fill="#FFFFFF" text-anchor="middle">python:3.11-slim, Gunicorn</text>
  <text x="1150" y="210" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Flask app, port 7860</text>
  <text x="1150" y="224" font-size="9.5" fill="#FFFFFF" text-anchor="middle">TensorFlow/Keras, OpenCV,</text>
  <text x="1150" y="238" font-size="9.5" fill="#FFFFFF" text-anchor="middle">Tesseract OCR, pikepdf</text>
  <text x="1150" y="264" font-size="10" fill="#595959" text-anchor="middle">scale-to-zero free tier</text>

  <!-- ============ CLOUDFLARE R2 NODE ============ -->
  <rect x="530" y="480" width="260" height="120" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="520" y="470" width="260" height="120" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <text x="650" y="496" font-size="11" fill="#595959" text-anchor="middle" font-style="italic">&#171;object storage&#187;</text>
  <text x="650" y="516" font-size="12.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Cloudflare R2</text>
  <line x1="538" y1="526" x2="762" y2="526" stroke="#D9D9D9" stroke-width="1"/>
  <text x="650" y="546" font-size="10" fill="#1A1A1A" text-anchor="middle">S3-compatible bucket</text>
  <text x="650" y="562" font-size="10" fill="#595959" text-anchor="middle">Optional persistent document storage;</text>
  <text x="650" y="578" font-size="10" fill="#595959" text-anchor="middle">CloudStorageService falls back to local disk if absent</text>

  <!-- ============ COMMUNICATION PATHS ============ -->
  <!-- Client -> Render -->
  <line x1="320" y1="150" x2="520" y2="150" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="140" font-size="10.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">HTTPS</text>
  <text x="420" y="168" font-size="9.5" fill="#595959" text-anchor="middle">(Blade HTML, form submit, PWA fetch)</text>

  <!-- Render -> HF Spaces (dashed, crosses hosting boundary) -->
  <line x1="940" y1="200" x2="1040" y2="180" stroke="#A6303E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="990" y="182" font-size="9.5" fill="#A6303E" text-anchor="middle" font-weight="bold">HTTPS</text>
  <text x="980" y="270" font-size="9.5" fill="#A6303E" text-anchor="middle">POST /analyze-document</text>
  <text x="980" y="284" font-size="9.5" fill="#A6303E" text-anchor="middle">GET /health (keep-warm, every 10 min)</text>
  <line x1="1040" y1="250" x2="940" y2="230" stroke="#A6303E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="990" y="220" font-size="9.5" fill="#A6303E" text-anchor="middle" font-weight="bold">JSON result</text>

  <!-- Render -> Cloudflare R2 (dashed, crosses hosting boundary) -->
  <line x1="700" y1="420" x2="700" y2="470" stroke="#A6303E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="712" y="450" font-size="9.5" fill="#A6303E" font-weight="bold">HTTPS</text>
  <text x="712" y="463" font-size="9" fill="#A6303E">S3 API (PUT/GET object)</text>

  <!-- Legend -->
  <rect x="40" y="650" width="1220" height="220" rx="10" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1.5"/>
  <text x="56" y="676" font-size="12" font-weight="bold" fill="#1A1A1A">Legend</text>

  <rect x="60" y="692" width="22" height="16" fill="#1F4E79"/>
  <text x="90" y="705" font-size="11" fill="#1A1A1A">Application-layer node (Laravel app / PostgreSQL database)</text>

  <rect x="60" y="718" width="22" height="16" fill="#C77C22"/>
  <text x="90" y="731" font-size="11" fill="#1A1A1A">AI/ML microservice node</text>

  <line x1="60" y1="754" x2="90" y2="754" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="98" y="758" font-size="11" fill="#1A1A1A">Same-host / intra-node communication path</text>

  <line x1="60" y1="780" x2="90" y2="780" stroke="#A6303E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="98" y="784" font-size="11" fill="#1A1A1A">Cross-hosting-boundary HTTPS call (different cloud platform)</text>

  <text x="60" y="812" font-size="10.5" fill="#595959">Two independently hosted, independently deployable services: the Laravel portal on Render.com and the aegis-ai</text>
  <text x="60" y="828" font-size="10.5" fill="#595959">forensic microservice on Hugging Face Spaces. Cloudflare R2 is optional, opportunistic object storage reached from Render.</text>
  <text x="60" y="848" font-size="10.5" fill="#595959">Local development targets SQLite and a local Python process instead of these managed nodes (not shown).</text>
</svg>
