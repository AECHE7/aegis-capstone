<line x1="303" y1="627" x2="503" y2="472" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="325" y="545" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#1A1A1A">fraud probability +</text>
<text x="325" y="559" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-style="italic" fill="#1A1A1A">risk tier</text>

<text x="1160" y="770" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" text-anchor="end" fill="#C77C22">amber outline = AI/ML subsystem boundary</text>
</svg>
