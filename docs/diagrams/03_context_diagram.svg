<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<rect x="0" y="0" width="1200" height="800" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
</marker>
</defs>

<text x="600" y="40" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 3. System Context Diagram (Level 0 DFD)</text>

<!-- Central process -->
<ellipse cx="600" cy="420" rx="150" ry="90" fill="#1F4E79" stroke="#1A1A1A" stroke-width="2"/>
<text x="600" y="412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#FFFFFF">0</text>
<text x="600" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">AEGIS System</text>

