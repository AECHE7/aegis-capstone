<text x="1020" y="194" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#595959">"admin" role)</text>

<rect x="900" y="630" width="240" height="90" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
