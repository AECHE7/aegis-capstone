<text x="1020" y="686" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Super Admin</text>
<text x="1020" y="704" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#595959">("superadmin" role)</text>

<rect x="60" y="630" width="260" height="90" fill="#FFFFFF" stroke="#C77C22" stroke-width="3"/>
