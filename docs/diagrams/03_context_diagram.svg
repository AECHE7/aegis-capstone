<text x="190" y="686" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Microservice</text>
<text x="190" y="704" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" fill="#595959">(external Python "aegis-ai" service)</text>

<!-- Student <-> AEGIS -->
<line x1="300" y1="195" x2="500" y2="350" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
