<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="980" height="760" fill="#FFFFFF"/>
  <text x="490" y="34" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Figure 14. Entity-Relationship Diagram &#8212; Scholarship Program Module</text>

  <!-- ============ RELATIONSHIP LINES (drawn first, under boxes) ============ -->
  <line x1="200" y1="345" x2="750" y2="155" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="289" font-size="10.5" fill="#1A1A1A">1</text>
  <text x="596" y="203" font-size="10.5" fill="#1A1A1A">0..*</text>

  <line x1="200" y1="345" x2="750" y2="346" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="341" font-size="10.5" fill="#1A1A1A">1</text>
  <text x="596" y="342" font-size="10.5" fill="#1A1A1A">0..*</text>

  <!-- ============ ENTITY: scholarships (x=70,y=250,w=260,h=190) ============ -->
  <g>
    <rect x="70" y="250" width="260" height="190" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="70" y="250" width="260" height="34" fill="#1F4E79"/>
    <text x="200" y="272" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">scholarships</text>
    <rect x="70" y="310" width="260" height="26" fill="#D9D9D9"/>
    <rect x="70" y="362" width="260" height="26" fill="#D9D9D9"/>
    <rect x="70" y="414" width="260" height="26" fill="#D9D9D9"/>
    <text x="82" y="301" font-size="11" fill="#1A1A1A">id</text>
    <text x="180" y="301" font-size="10" fill="#595959">bigint, auto-inc</text>
    <text x="316" y="301" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">PK</text>
    <text x="82" y="327" font-size="11" fill="#1A1A1A">name</text>
    <text x="180" y="327" font-size="10" fill="#595959">string(255)</text>
    <text x="82" y="353" font-size="11" fill="#1A1A1A">min_gwa_required</text>
    <text x="180" y="353" font-size="10" fill="#595959">decimal(3,2)</text>
    <text x="82" y="379" font-size="11" fill="#1A1A1A">deadline</text>
    <text x="180" y="379" font-size="10" fill="#595959">date</text>
    <text x="82" y="405" font-size="11" fill="#1A1A1A">status</text>
    <text x="180" y="405" font-size="10" fill="#595959">Active / Closed</text>
    <text x="82" y="431" font-size="11" fill="#1A1A1A">max_renewals</text>
    <text x="180" y="431" font-size="10" fill="#595959">tinyint, default 4</text>
    <line x1="70" y1="284" x2="330" y2="284" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="310" x2="330" y2="310" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="336" x2="330" y2="336" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="362" x2="330" y2="362" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="388" x2="330" y2="388" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="70" y1="414" x2="330" y2="414" stroke="#1A1A1A" stroke-width="1"/>
  </g>

  <!-- ============ ENTITY: scholarship_fields (x=620,y=60,w=260,h=190) ============ -->
  <g>
    <rect x="620" y="60" width="260" height="190" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="620" y="60" width="260" height="34" fill="#1F4E79"/>
    <text x="750" y="82" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">scholarship_fields</text>
    <rect x="620" y="120" width="260" height="26" fill="#D9D9D9"/>
    <rect x="620" y="172" width="260" height="26" fill="#D9D9D9"/>
    <rect x="620" y="224" width="260" height="26" fill="#D9D9D9"/>
    <text x="632" y="111" font-size="11" fill="#1A1A1A">id</text>
    <text x="730" y="111" font-size="10" fill="#595959">bigint, auto-inc</text>
    <text x="866" y="111" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">PK</text>
    <text x="632" y="137" font-size="11" fill="#1A1A1A">scholarship_id</text>
    <text x="730" y="137" font-size="10" fill="#595959">bigint</text>
    <text x="866" y="137" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">FK</text>
    <text x="632" y="163" font-size="11" fill="#1A1A1A">field_name</text>
    <text x="730" y="163" font-size="10" fill="#595959">string, machine key</text>
    <text x="632" y="189" font-size="11" fill="#1A1A1A">field_label</text>
    <text x="730" y="189" font-size="10" fill="#595959">string, prompt text</text>
    <text x="632" y="215" font-size="11" fill="#1A1A1A">field_type</text>
    <text x="730" y="215" font-size="10" fill="#595959">text/number/select/file</text>
    <text x="632" y="241" font-size="11" fill="#1A1A1A">is_required</text>
    <text x="730" y="241" font-size="10" fill="#595959">boolean</text>
    <line x1="620" y1="94" x2="880" y2="94" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="120" x2="880" y2="120" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="146" x2="880" y2="146" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="172" x2="880" y2="172" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="198" x2="880" y2="198" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="224" x2="880" y2="224" stroke="#1A1A1A" stroke-width="1"/>
  </g>

  <!-- ============ ENTITY: scholarship_staff (pivot) (x=620,y=290,w=260,h=112) ============ -->
  <g>
    <rect x="620" y="290" width="260" height="112" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="620" y="290" width="260" height="34" fill="#1F4E79"/>
    <text x="750" y="312" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">scholarship_staff</text>
    <rect x="620" y="350" width="260" height="26" fill="#D9D9D9"/>
    <text x="632" y="341" font-size="11" fill="#1A1A1A">id</text>
    <text x="730" y="341" font-size="10" fill="#595959">bigint, auto-inc</text>
    <text x="866" y="341" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">PK</text>
    <text x="632" y="367" font-size="11" fill="#1A1A1A">scholarship_id</text>
    <text x="730" y="367" font-size="10" fill="#595959">bigint</text>
    <text x="866" y="367" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">FK</text>
    <text x="632" y="393" font-size="11" fill="#1A1A1A">user_id</text>
    <text x="730" y="393" font-size="10" fill="#595959">bigint (staff)</text>
    <text x="866" y="393" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">FK</text>
    <line x1="620" y1="324" x2="880" y2="324" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="350" x2="880" y2="350" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="376" x2="880" y2="376" stroke="#1A1A1A" stroke-width="1"/>
  </g>
  <text x="620" y="418" font-size="10" fill="#595959" font-style="italic">M:N pivot &#8212; also references users.id (Identity &amp; Access module, Fig. 13).</text>

  <!-- ============ ENTITY: academic_terms (x=620,y=460,w=260,h=138) ============ -->
  <g>
    <rect x="620" y="460" width="260" height="138" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="620" y="460" width="260" height="34" fill="#1F4E79"/>
    <text x="750" y="482" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">academic_terms</text>
    <rect x="620" y="520" width="260" height="26" fill="#D9D9D9"/>
    <rect x="620" y="572" width="260" height="26" fill="#D9D9D9"/>
    <text x="632" y="511" font-size="11" fill="#1A1A1A">id</text>
    <text x="730" y="511" font-size="10" fill="#595959">bigint, auto-inc</text>
    <text x="866" y="511" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="end">PK</text>
    <text x="632" y="537" font-size="11" fill="#1A1A1A">semester</text>
    <text x="730" y="537" font-size="10" fill="#595959">string, e.g. 1st Sem</text>
    <text x="632" y="563" font-size="11" fill="#1A1A1A">academic_year</text>
    <text x="730" y="563" font-size="10" fill="#595959">string, e.g. 2025-2026</text>
    <text x="632" y="589" font-size="11" fill="#1A1A1A">is_active</text>
    <text x="730" y="589" font-size="10" fill="#595959">boolean, one active</text>
    <line x1="620" y1="494" x2="880" y2="494" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="520" x2="880" y2="520" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="546" x2="880" y2="546" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="620" y1="572" x2="880" y2="572" stroke="#1A1A1A" stroke-width="1"/>
  </g>
  <text x="620" y="616" font-size="10" fill="#595959" font-style="italic">No FK within this module &#8212; scopes Application.academic_term_id</text>
  <text x="620" y="630" font-size="10" fill="#595959" font-style="italic">(1:0..*, set null) in the Application Lifecycle module (Fig. 15).</text>

  <text x="70" y="700" font-size="10.5" fill="#595959" font-style="italic">A Scholarship defines its own dynamic application form via ScholarshipField (EAV schema) and is staffed by Users through the scholarship_staff pivot.</text>
  <text x="70" y="718" font-size="10.5" fill="#595959" font-style="italic">On-delete behavior: scholarship_fields and scholarship_staff cascade from scholarships.</text>
</svg>
