  <text x="70" y="700" font-size="10.5" fill="#595959" font-style="italic">Application is the operational core: it owns ApplicationField answers (EAV values), Document uploads, and StatusLog transitions.</text>
  <text x="70" y="718" font-size="10.5" fill="#595959" font-style="italic">Each Document may carry exactly one AIResult (forensic scan outcome). All four owned relationships cascade on delete; evaluated_by/previous_application_id set null.</text>
