<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<rect x="0" y="0" width="1200" height="700" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
</marker>
<marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#595959"/>
</marker>
</defs>

<text x="600" y="50" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Figure 1. Conceptual Framework of the AEGIS System (IPO Model)</text>

<!-- INPUT box -->
<rect x="40" y="140" width="320" height="420" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="200" y="185" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F4E79">INPUT</text>
<line x1="60" y1="200" x2="340" y2="200" stroke="#1F4E79" stroke-width="2"/>
<text x="60" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; Student personal &amp; academic</text>
<text x="72" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">profile data</text>
<text x="60" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; GWA / grade documents</text>
<text x="72" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">(Certificate of Grades)</text>
<text x="60" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; Scholarship program &amp; term</text>
<text x="72" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">criteria set by OSA</text>

<!-- Large arrow 1 -->
<line x1="368" y1="350" x2="428" y2="350" stroke="#1F4E79" stroke-width="4" marker-end="url(#arrow)"/>

<!-- PROCESS box -->
<rect x="440" y="140" width="320" height="420" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="600" y="185" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#C77C22">PROCESS</text>
<line x1="460" y1="200" x2="740" y2="200" stroke="#C77C22" stroke-width="2"/>
<text x="460" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; AI-assisted document forensic</text>
<text x="472" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">verification (EFDF pipeline)</text>
<text x="460" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; Multi-tier staff and director</text>
<text x="472" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">review workflow</text>
<text x="460" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; Automated eligibility and</text>
<text x="472" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">auto-approval logic</text>

<!-- Large arrow 2 -->
<line x1="768" y1="350" x2="828" y2="350" stroke="#1F4E79" stroke-width="4" marker-end="url(#arrow)"/>

<!-- OUTPUT box -->
<rect x="840" y="140" width="320" height="420" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="1000" y="185" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F4E79">OUTPUT</text>
<line x1="860" y1="200" x2="1140" y2="200" stroke="#1F4E79" stroke-width="2"/>
<text x="860" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; Verified/approved or flagged</text>
<text x="872" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">scholarship applications</text>
<text x="860" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; Complete audit trail (status</text>
<text x="872" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">logs, admin action logs)</text>
<text x="860" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">&#8226; Stipend eligibility</text>
<text x="872" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">decisions</text>

<!-- Feedback loop -->
<path d="M 1000,560 C 1000,640 600,640 600,560" fill="none" stroke="#595959" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
<text x="800" y="618" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#595959">Feedback Loop</text>
<text x="800" y="660" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#595959">review outcomes refine future</text>
<text x="800" y="678" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#595959">auto-approval threshold calibration</text>
</svg>
